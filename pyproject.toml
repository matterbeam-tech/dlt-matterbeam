[project]
name = "dlt-matterbeam"
version = "0.1.0"
description = "dlt destination for Matterbeam"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["dlt>=1.29,<1.31", "zstandard==0.25.0", "requests>=2.31"]

[project.entry-points.dlt]
dlt_matterbeam = "dlt_matterbeam.__plugins__"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dlt_matterbeam"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
markers = [
    "integration: needs MATTERBEAM_API_TOKEN / MATTERBEAM_BASE_URL (not collected by default)",
    "vendor_parity: needs a readable ../../backend checkout with matterbeam_shared importable",
]
